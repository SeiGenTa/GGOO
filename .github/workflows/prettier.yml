name: Prettier Check

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - '**'

jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9 # O la versión específica que uses en tu PC

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  cache: 'pnpm' # Almacena en caché los paquetes para acelerar futuros runs

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile # Equivalente estricto a npm ci

            - name: Run Prettier Check
              run: pnpm exec prettier --check .
