name: Prettier Check

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - '**'

jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            # Forzamos la remoción de cualquier archivo de workspace corrupto o vacío en el CI
            - name: Remove broken workspace file
              shell: bash
              run: rm -f pnpm-workspace.yaml

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Prettier Check
              run: pnpm exec prettier --check .
