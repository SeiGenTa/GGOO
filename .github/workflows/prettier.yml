name: Prettier Check

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - '**'

jobs:
    prettier:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # 1. Configuramos Node primero (sin activar caché aquí)
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'

            # 2. Instalamos pnpm y activamos su caché nativa directamente
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
                  run_install: false # Evita que instale antes de configurar la caché

            # 3. Obtenemos de forma segura la ruta para la caché interna de GitHub
            - name: Get pnpm store directory
              shell: bash
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            # 4. Usamos la acción nativa de GitHub para cachear la carpeta exacta de pnpm
            - name: Cache pnpm modules
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Prettier Check
              run: pnpm exec prettier --check .
