name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para que el script tenga permiso de subir la imagen a GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for Build Args
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "PORT_APP=5173" >> .env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construimos usando tu docker-compose local
      - name: Build Specific Service
        run: docker compose build app-production

      # Le ponemos la etiqueta de GitHub y la subimos directamente a la nube
      - name: Tag and Push to GHCR
        run: |
          docker tag ggoo-app-production:latest ghcr.io/seigenta/ggoo-app-production:latest
          docker push ghcr.io/seigenta/ggoo-app-production:latest
